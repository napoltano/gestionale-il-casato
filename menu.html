lia · dal 1990</span></header>

  <main id="menu"><p class="empty">Carico il menu…</p></main>
  <p class="note" id="foot"></p>
</div>
<script>
(function(){
const CATS=[['antipasti','Antipasti'],['primi','Primi'],['secondi','Secondi'],['contorni','Contorni'],['pizze','Pizze'],['dolci','Dolci'],['bevande','Bevande'],['vini','Vini']];
const ALG={glutine:'Glutine',crostacei:'Crostacei',uova:'Uova',pesce:'Pesce',arachidi:'Arachidi',soia:'Soia',latte:'Latte','frutta-guscio':'Frutta a guscio',sedano:'Sedano',senape:'Senape',sesamo:'Sesamo',solfiti:'Solfiti',lupini:'Lupini',molluschi:'Molluschi'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>'€ '+(Math.round((+n||0)*100)/100).toFixed(2).replace('.',',');
const CK='casato.publicmenu';
function render(j){
  const ds=(j.dishes||[]).slice().sort((a,b)=>(a.pos||0)-(b.pos||0)||String(a.name).localeCompare(String(b.name)));
  const cats=CATS.filter(([k])=>ds.some(d=>d.cat===k));
  if(!cats.length){document.getElementById('menu').innerHTML='<p class="empty">Il menu sarà disponibile a breve.</p>';return}
  document.getElementById('nav').innerHTML=cats.map(([k,l])=>`<a href="#${k}">${l}</a>`).join('');
  document.getElementById('menu').innerHTML=cats.map(([k,l])=>`<section id="${k}"><h2>${l}</h2>${ds.filter(d=>d.cat===k).map(d=>`
    <div class="d${d.available?'':' off'}"><div class="top"><b>${esc(d.name)}</b><span class="price">${d.available?eur(d.price):'esaurito'}</span></div>
      ${(d.ingredients||[]).length?`<span class="ing">${esc(d.ingredients.join(', '))}</span>`:''}${d.desc?`<span class="ing">${esc(d.desc)}</span>`:''}
      ${(d.allergens||[]).length?`<span class="algs">${d.allergens.map(a=>`<i>${esc(ALG[a]||a)}</i>`).join('')}</span>`:''}</div>`).join('')}</section>`).join('');
  document.getElementById('foot').innerHTML=(j.cover?'Coperto '+eur(j.cover)+' a persona. ':'')+'Per allergie e intolleranze chiedi al personale di sala: le informazioni sugli allergeni sono indicate per ogni piatto.';
  if(j.restaurant)document.title='Menu · '+j.restaurant;
}
try{const c=JSON.parse(localStorage.getItem(CK)||'null');if(c)render(c)}catch(e){}
fetch(window.CASATO_API,{method:'POST',body:JSON.stringify({action:'publicMenu'})}).then(r=>r.json()).then(j=>{if(j.ok){render(j);try{localStorage.setItem(CK,JSON.stringify(j))}catch(e){}}})
  .catch(()=>{if(!document.querySelector('.d'))document.getElementById('menu').innerHTML='<p class="empty">Non riesco a caricare il menu. Controlla la connessione e riprova.</p>'});
})();
</script>
