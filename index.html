            return`<div class="pline${ok?' ok':''}"><span><span class="pn">${q}× ${esc(it.name)}</span> ${modsHTML(it)}</span>
              <button class="btn sm${ok?'':' primary'}" type="button" data-act="pz-line" data-oid="${o.id}" data-i="${i}">${ok?'Rifai':'Fatta'}</button>
              ${q>1?`<div class="units">${Array.from({length:q},(_,u)=>`<button class="unit${u<dq?' on':''}" type="button" data-act="pz-unit" data-oid="${o.id}" data-i="${i}" data-u="${u}" aria-label="Pizza ${u+1} di ${q}${u<dq?' fatta':''}">${u+1}</button>`).join('')}</div>`:''}</div>`}).join('')}
          ${o.note?`<div class="sub" style="text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink)">Nota: ${esc(o.note)}</div>`:''}`).join('')}
        ${t.todo?`<div class="tf"><button class="btn primary" type="button" data-act="pz-table" data-k="${esc(t.orders[0].o.mapId+'|'+t.orders[0].o.tableId)}">Tutto il tavolo pronto</button></div>`:''}
      </div>`}).join('')}</div>`
    :`<div class="card pz-empty"><h2>Nessuna pizza da fare</h2><p>Le comande con pizze compaiono qui appena il cameriere le invia, con il numero del tavolo.</p></div>`}`;
}
function pizzaMark(oid,i,newDone){
  const o=S.orders[oid];if(!o)return;const n=clone(o);delete n.id;const it=n.items[i];if(!it)return;
  it.doneQty=clamp(newDone,0,+it.qty||1);it.doneAt=it.doneQty?Date.now():null;it.doneBy=it.doneQty?((S.me&&S.me.name)||''):'';
  saveDoc('orders',oid,n);
}
setInterval(()=>{if(S.view==='pizza')renderPizza()},30000);

/* ---------- azioni ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='noop'&&b===e.target.closest('[data-act]'))return;
  switch(a){
    case'order-open':openOrder(b.dataset.tid);break;
    case'order-x':closeOrder();break;
    case'opane':S.opane=b.dataset.v;renderOrderUI();break;
    case'ocat':S.ocat=b.dataset.v;renderOrderUI();break;
    case'dish-quick':{e.stopPropagation();const d=S.menu[b.dataset.id];if(!d)break;
      const it=itemFromDish(d),same=S.cart.items.find(x=>x.dishId===d.id&&!x.minus.length&&!x.plus.length&&!x.note);
      if(same)same.qty++;else S.cart.items.push(it);renderOrderUI();toast(d.name+' aggiunto');break}
    case'dish-pick':{if(e.target.closest('.addbtn'))break;const d=S.menu[b.dataset.id];if(d)openItemEditor(itemFromDish(d),null);break}
    case'cq':{const it=S.cart.items[+b.dataset.i];if(!it)break;it.qty=(+it.qty||1)+ +b.dataset.v;if(it.qty<1)S.cart.items.splice(+b.dataset.i,1);renderOrderUI();break}
    case'cedit':{const it=S.cart.items[+b.dataset.i];if(it)openItemEditor(it,+b.dataset.i);break}
    case'ie-x':if(b===e.target||b.tagName==='BUTTON'){S.itemEdit=null;$('#dlg').innerHTML=''}break;
    case'ie-q':S.itemEdit.item.qty=Math.max(1,S.itemEdit.item.qty+ +b.dataset.v);renderItemEditor();break;
    case'ie-minus':{const l=S.itemEdit.item.minus,v=b.dataset.v,i=l.indexOf(v);i<0?l.push(v):l.splice(i,1);renderItemEditor();break}
    case'ie-plus':{const l=S.itemEdit.item.plus,x=S.menu[b.dataset.id],i=l.findIndex(p=>p.id===b.dataset.id);
      if(i>=0)l.splice(i,1);else if(x)l.push({id:x.id,name:x.name,price:+x.price||0});renderItemEditor();break}
    case'ie-ok':{const e2=S.itemEdit;e2.item.note=($('#ie-note').value||'').trim();if(e2.idx==null)S.cart.items.push(e2.item);else S.cart.items[e2.idx]=e2.item;
      S.itemEdit=null;$('#dlg').innerHTML='';renderOrderUI();break}
    case'ie-del':{S.cart.items.splice(S.itemEdit.idx,1);S.itemEdit=null;$('#dlg').innerHTML='';renderOrderUI();break}
    case'order-send':S.cart.note=($('#o-note')||{}).value||'';sendOrder();break;
    case'served':{const o=S.orders[b.dataset.oid];if(o){const n=clone(o);delete n.id;n.servedAt=Date.now();saveDoc('orders',o.id,n);renderStage();renderPanelForce()}break}
    case'bill-close':{const tid=b.dataset.tid;if(S.confirm!=='bill'+tid){S.confirm='bill'+tid;renderPanelForce();break}
      S.confirm=null;const os=ordersFor(tid),tot=os.reduce((x,o)=>x+orderTotal(o),0);
      os.forEach(o=>{const n=clone(o);delete n.id;n.closed=true;n.closedAt=Date.now();n.total=orderTotal(o);saveDoc('orders',o.id,n)});
      renderStage();renderPanelForce();toast('Conto chiuso: '+eur(tot));break}
    case'mcat':S.menuCat=b.dataset.v;renderMenu();break;
    case'd-new':S.confirm=null;dishEditor(null);break;
    case'd-edit':S.confirm=null;dishEditor(S.menu[b.dataset.id]);break;
    case'd-avail':{const d=S.menu[b.dataset.id];if(d){saveDoc('menu',d.id,Object.assign({},d,{available:d.available===false}));renderMenu()}break}
    case'dlg-x':if(b===e.target||b.tagName==='BUTTON'){$('#dlg').innerHTML='';S.confirm=null;if(S.view==='menu')renderMenu()}break;
    case'de-ok':{const name=$('#de-name').value.trim(),price=parseFloat(String($('#de-price').value).replace(',','.'));
      if(!name){toast('Scrivi il nome del piatto');$('#de-name').focus();break}
      if(!(price>=0)){toast('Indica il prezzo');$('#de-price').focus();break}
      const id=b.dataset.id||uid(),old=S.menu[id]||{};
      saveDoc('menu',id,Object.assign({},old,{kind:'dish',name,cat:$('#de-cat').value,price,ingredients:$('#de-ingr').value.split(',').map(x=>x.trim()).filter(Boolean),
        desc:$('#de-desc').value.trim(),available:$('#de-av').checked,pos:old.pos||Date.now(),ex:false}));
      $('#dlg').innerHTML='';renderMenu();toast(b.dataset.id?'Piatto salvato':name+' aggiunto al menu');break}
    case'de-del':{if(S.confirm!=='ddel'){S.confirm='ddel';dishEditor(S.menu[b.dataset.id]);break}
      S.confirm=null;const d=S.menu[b.dataset.id];delDoc('menu',b.dataset.id);$('#dlg').innerHTML='';renderMenu();toast((d&&d.name||'Piatto')+' eliminato');break}
    case'd-sample':{const t0=Date.now();sampleMenu().forEach((d,i)=>saveDoc('menu',uid(),Object.assign(d,{pos:t0+i})));renderMenu();toast('Menu d\'esempio caricato: modificalo o eliminalo quando vuoi');break}
    case'd-clear-ex':{if(S.confirm!=='clearex'){S.confirm='clearex';renderMenu();break}S.confirm=null;
      Object.values(S.menu).filter(d=>d.ex).forEach(d=>delDoc('menu',d.id));renderMenu();toast('Piatti d\'esempio eliminati');break}
    case'x-edit':extrasEditor();break;
    case'xe-add':{const name=$('#xe-name').value.trim();if(!name){toast('Scrivi il nome dell\'aggiunta');break}
      saveDoc('menu',uid(),{kind:'extra',name,price:parseFloat(String($('#xe-price').value).replace(',','.'))||0,cats:[]});extrasEditor();break}
    case'xe-del':delDoc('menu',b.dataset.id);extrasEditor();break;
    case'pz-line':{const o=S.orders[b.dataset.oid],it=o&&o.items[+b.dataset.i];if(!it)break;
      pizzaMark(o.id,+b.dataset.i,(+it.doneQty||0)>=(+it.qty||1)?0:+it.qty||1);renderPizza();break}
    case'pz-unit':{const o=S.orders[b.dataset.oid],it=o&&o.items[+b.dataset.i];if(!it)break;const u=+b.dataset.u;
      pizzaMark(o.id,+b.dataset.i,u<(+it.doneQty||0)?u:u+1);renderPizza();break}
    case'pz-table':{const [mid,tid]=b.dataset.k.split('|');let n=0;
      openOrders().filter(o=>o.mapId===mid&&o.tableId===tid).forEach(o=>{const c=clone(o);delete c.id;let ch=false;
        c.items.forEach(it=>{if(isPizza(it)&&(+it.doneQty||0)<(+it.qty||1)){n+=(+it.qty||1)-(+it.doneQty||0);it.doneQty=+it.qty||1;it.doneAt=Date.now();it.doneBy=(S.me&&S.me.name)||'';ch=true}});
        if(ch)saveDoc('orders',o.id,c)});
      renderPizza();toast('Tavolo pronto: '+n+(n===1?' pizza':' pizze'));break}
    case'pz-sound':prefSet('sound',prefGet('sound')==='off'?'on':'off');if(prefGet('sound')!=='off'){try{actx&&actx.resume()}catch(x){}beep(1)}renderPizza();break;
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='o-q'){S.oq=el.value;renderOrderUI();return}
  if(el.id==='o-note'&&S.cart){S.cart.note=el.value;return}
  if(el.id==='m-q'){S.menuQ=el.value;clearTimeout(renderMenu.t);renderMenu.t=setTimeout(()=>{renderMenu();const f=$('#m-q');if(f){f.focus();const l=f.value.length;f.setSelectionRange(l,l)}},150);return}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='m-table'&&el.value){const tid=el.value;el.value='';openOrder(tid);return}
  if(el.id==='pz-done'){S.pzDone=el.checked;renderPizza();return}
  if(el.dataset&&el.dataset.x){const x=S.menu[el.dataset.x];if(!x)return;const v=el.dataset.f==='price'?(parseFloat(String(el.value).replace(',','.'))||0):el.value.trim();
    if(el.dataset.f==='name'&&!v){el.value=x.name;return}saveDoc('menu',x.id,Object.assign({},x,{[el.dataset.f]:v}));return}
  if(el.dataset&&el.dataset.xc){const x=S.menu[el.dataset.xc];if(!x)return;const cats=new Set(x.cats||[]);el.checked?cats.add(el.value):cats.delete(el.value);
    saveDoc('menu',x.id,Object.assign({},x,{cats:[...cats]}));return}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#dlg').innerHTML){S.itemEdit=null;$('#dlg').innerHTML='';e.stopImmediatePropagation()}else if(S.cart){closeOrder();e.stopImmediatePropagation()}}
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('.orow')){e.target.click()}
},true);

/* ---------- unione tavoli ---------- */
function overlapTable(o){
  const m=curMap();let best=null,ba=0;
  for(const t of m.tables){if(t.id===o.id)continue;
    const ix=Math.min(o.x+o.w,t.x+t.w)-Math.max(o.x,t.x),iy=Math.min(o.y+o.h,t.y+t.h)-Math.max(o.y,t.y);
    if(ix<=0||iy<=0)continue;const a=ix*iy,minA=Math.min(o.w*o.h,t.w*t.h);
    if(a/minA>=.2&&a>ba){ba=a;best=t}}
  return best;
}
function sideOf(d,t){const dx=(d.x+d.w/2)-(t.x+t.w/2),dy=(d.y+d.h/2)-(t.y+t.h/2);
  return Math.abs(dx)/(t.w+d.w)>=Math.abs(dy)/(t.h+d.h)?(dx>=0?'right':'left'):(dy>=0?'bottom':'top')}
let mergeCtx=null;
function askMerge(d,t){
  if(RO()){Object.assign(d.o,{x:d.ox,y:d.oy});renderStage();return}
  mergeCtx={d,t};
  const tot=(+t.seats||0)+(+d.o.seats||0);
  $('#modal').innerHTML=`<div class="modal-bg" data-act="merge-no"><div class="card modal" role="dialog" aria-modal="true" aria-labelledby="mg-t" data-act="noop">
    <span class="eyebrow">Tavoli sovrapposti</span>
    <h3 id="mg-t">Vuoi unire il tavolo ${esc(d.o.num)} al tavolo ${esc(t.num)}?</h3>
    <div class="sum"><span class="tchip">Tav. ${esc(t.num)} · ${t.seats} posti</span>+<span class="tchip">Tav. ${esc(d.o.num)} · ${d.o.seats} posti</span>=<span class="tchip main">${tot} posti</span></div>
    <div class="acts">
      <button class="btn primary" type="button" data-act="merge-ok">Unisci in un unico tavolo<small>Diventa il tavolo ${esc(t.num)}+${esc(d.o.num)} da ${tot} posti. Puoi separarli quando vuoi.</small></button>
      <button class="btn" type="button" data-act="merge-side">Affianca soltanto<small>Li mette uno accanto all'altro senza unirli.</small></button>
      <button class="btn ghost" type="button" data-act="merge-no">Annulla<small>Il tavolo ${esc(d.o.num)} torna dov'era.</small></button>
    </div></div></div>`;
  const b=$('#modal [data-act=merge-ok]');b&&b.focus();
}
function closeMerge(){$('#modal').innerHTML='';mergeCtx=null}
function retarget(fromId,toId){
  const fix=r=>{const ids=tablesOf(r);if(!ids.includes(fromId))return r;
    const n=[...new Set(ids.map(x=>x===fromId?toId:x))];return Object.assign({},r,{tableId:n[0],linked:n.slice(1)})};
  const apply=r=>{const n=fix(r);if(n!==r)saveRes(n)};
  Object.values(S.res).forEach(apply);
  Object.values(S.orders).filter(o=>o.tableId===fromId).forEach(o=>{const n=clone(o);delete n.id;n.tableId=toId;saveDoc('orders',o.id,n)});
  if(S.mode==='db'){eachRes('tableId','==',fromId,(id,r)=>{if(!S.res[id])apply(r)});eachRes('linked','array-contains',fromId,(id,r)=>{if(!S.res[id])apply(r)})}
  else Object.values(S.allRes).filter(r=>!S.res[r.id]).forEach(apply);
}
function doMerge(){
  const {d,t}=mergeCtx,m=curMap(),o=d.o,side=sideOf(o,t);
  const strip=x=>{const c=clone(x);delete c.parts;return c};
  const partsOf=(x,pos)=>(x.parts&&x.parts.length)?clone(x.parts):[Object.assign(strip(x),pos||{})];
  const parts=[...partsOf(t),...partsOf(o,{x:d.ox,y:d.oy})];
  const horiz=side==='left'||side==='right';
  const T={w:t.w,h:t.h},D={w:o.w,h:o.h};
  if(t.shape==='round'||o.shape==='round'){T.w=T.h=Math.max(T.w,T.h);D.w=D.h=Math.max(D.w,D.h)}
  const nw=horiz?T.w+D.w:Math.max(T.w,D.w),nh=horiz?Math.max(T.h,D.h):T.h+D.h;
  const nx=side==='left'?t.x-D.w:t.x,ny=side==='top'?t.y-D.h:t.y;
  const seats=(+t.seats||0)+(+o.seats||0);
  Object.assign(t,{shape:'rect',w:snap(nw),h:snap(nh),x:snap(nx),y:snap(ny),seats,num:t.num+'+'+o.num,parts});
  clampEnt('table',t,m);
  m.tables=m.tables.filter(x=>x.id!==o.id);
  retarget(o.id,t.id);
  closeMerge();S.sel=t.id;S.selKind='table';S.draft=null;saveMap(S.mapId);renderSala();toast('Tavoli uniti: '+t.num+' · '+seats+' posti');
}
function doSide(){
  const {d,t}=mergeCtx,m=curMap(),o=d.o,side=sideOf(o,t);
  if(side==='right'){o.x=t.x+t.w;o.y=t.y+(t.h-o.h)/2}else if(side==='left'){o.x=t.x-o.w;o.y=t.y+(t.h-o.h)/2}
  else if(side==='bottom'){o.y=t.y+t.h;o.x=t.x+(t.w-o.w)/2}else{o.y=t.y-o.h;o.x=t.x+(t.w-o.w)/2}
  o.x=snap(o.x);o.y=snap(o.y);clampEnt('table',o,m);
  closeMerge();S.sel=o.id;S.selKind='table';saveMap(S.mapId);renderSala();toast('Tavoli affiancati');
}
function cancelMerge(){const {d}=mergeCtx;Object.assign(d.o,{x:d.ox,y:d.oy});closeMerge();renderStage();renderPanelForce()}
function splitTable(t){
  const m=curMap(),parts=clone(t.parts||[]);if(!parts.length)return;
  const first=parts.find(p=>p.id===t.id)||parts[0];
  m.tables=m.tables.filter(x=>x.id!==t.id);
  parts.forEach(p=>{if(m.tables.some(x=>x.id===p.id))p.id=uid();clampEnt('table',p,m);m.tables.push(p)});
  saveMap(S.mapId);S.sel=first.id;S.selKind='table';renderSala();toast('Tavoli separati: '+parts.map(p=>p.num).join(', '));
}

/* ---------- drag, resize, pan, pinch ---------- */
const floor=$('#floor'),wrap=$('#wrap'),pointers=new Map();let pinch=null;
floor.addEventListener('pointerdown',e=>{
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){
    if(drag){const d=drag;drag=null;Object.assign(d.o,{x:d.ox,y:d.oy,w:d.ow,h:d.oh});renderStage()}
    pan=null;const [a,b]=[...pointers.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:S.zoom};return;
  }
  const el=e.target.closest('.table,.item');
  try{floor.setPointerCapture(e.pointerId)}catch(_){}
  if(!el){pan={sx:e.clientX,sy:e.clientY,sl:wrap.scrollLeft,st:wrap.scrollTop,moved:false};return}
  const kind=el.dataset.kind,o=kind==='item'?findItem(el.dataset.id):findTable(el.dataset.id);if(!o)return;
  drag={kind,o,el,mapId:S.mapId,rz:!!e.target.closest('[data-rz]'),sx:e.clientX,sy:e.clientY,ox:o.x,oy:o.y,ow:o.w,oh:o.h,moved:false};
});
floor.addEventListener('pointermove',e=>{
  if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pointers.size>=2){const [a,b]=[...pointers.values()];setZoom(pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d,{x:(a.x+b.x)/2,y:(a.y+b.y)/2});return}
  if(pan){const dx=e.clientX-pan.sx,dy=e.clientY-pan.sy;if(!pan.moved&&Math.hypot(dx,dy)<5)return;
    pan.moved=true;floor.classList.add('panning');wrap.scrollLeft=pan.sl-dx;wrap.scrollTop=pan.st-dy;return}
  if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6)return;
  if(S.locked)return;
  drag.moved=true;drag.el.classList.add('dragging');
  const dx=(e.clientX-drag.sx)/scale,dy=(e.clientY-drag.sy)/scale,o=drag.o,m=curMap();
  if(drag.rz){o.w=snap(drag.ow+dx);o.h=snap(drag.oh+dy);o.x=drag.ox;o.y=drag.oy;clampEnt(drag.kind,o,m);
    drag.el.style.width=o.w+'px';drag.el.style.height=o.h+'px';drag.el.innerHTML=drag.kind==='item'?itemInner(o):tableInner(o)}
  else{o.x=snap(drag.ox+dx);o.y=snap(drag.oy+dy);clampEnt(drag.kind,o,m);drag.el.style.left=o.x+'px';drag.el.style.top=o.y+'px';
    if(drag.kind==='table'){const hit=overlapTable(o);const id=hit?hit.id:null;if(id!==drag.hit){floor.querySelectorAll('.table.target').forEach(x=>x.classList.remove('target'));
      if(id){const el=floor.querySelector(`.table[data-id="${id}"]`);el&&el.classList.add('target')}drag.hit=id}}}
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pinch){if(pointers.size<2)pinch=null;pan=null;return}
  if(pan){const p=pan;pan=null;floor.classList.remove('panning');if(!p.moved&&S.sel)select(null);return}
  if(!drag)return;const d=drag;drag=null;
  if(d.moved&&d.kind==='table'&&!d.rz){const hit=overlapTable(d.o);if(hit){askMerge(d,hit);return}}
  if(d.moved){saveMap(d.mapId);S.sel=d.o.id;S.selKind=d.kind;S.confirm=null;renderStage();renderPanelForce()}
  else select(d.o.id,d.kind);
}
floor.addEventListener('pointerup',endPointer);
floor.addEventListener('pointercancel',endPointer);
wrap.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();setZoom(S.zoom*(e.deltaY<0?1.1:1/1.1),{x:e.clientX,y:e.clientY})}},{passive:false});
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(!drag&&S.view==='sala'){applyScale();renderPanelForce()}},120)});
setInterval(()=>{if(S.view==='sala'&&isToday()&&!drag&&!$('#panel').contains(document.activeElement)){renderStage();if(S.ptab==='wait'&&!S.sel)renderPanelForce()}},60000);
const ps=prefGet('shift');if(ps&&['pranzo','cena','tutto'].includes(ps)&&false)S.shift=ps;
window.__app={setRole:(r,raw)=>setRole(r,raw),refreshSettings:f=>{const a=document.activeElement;if(S.view==='settings'&&(f||!(a&&$('#view-settings').contains(a)&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))))renderSettings()}};
boot();
})();
</script>
